name: Tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/check.py
      - run: python -m trendtrade101 verify-inputs
      - run: python -m trendtrade101 export-dashboard --output dist/TrendTrade101_Dashboard.html
      - uses: actions/upload-artifact@v4
        with:
          name: research-dashboard
          path: dist/TrendTrade101_Dashboard.html
          retention-days: 30
