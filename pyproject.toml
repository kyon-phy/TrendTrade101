[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trendtrade101"
version = "0.1.0"
description = "Causal, auditable US and Japan trend research"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
trendtrade101 = "trendtrade101.cli:main"

[tool.setuptools.package-data]
trendtrade101 = ["web/*.html", "web/*.css", "web/*.js"]
